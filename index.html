<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Garden Flip - Simulator</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --accent-pink: #ec4899;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
    }

    .balance-box {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      text-align: center;
    }

    /* Moneta / Animacja */
    .coin-wrapper {
      perspective: 1000px;
      margin: 30px auto;
      width: 120px;
      height: 120px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      border: 4px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .side-green {
      background: radial-gradient(circle, #22c55e, #15803d);
    }

    .side-pink {
      background: radial-gradient(circle, #ec4899, #be185d);
      transform: rotateY(180deg);
    }

    /* Opcje wyboru side */
    .choices {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 25px;
    }

    .choice-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid transparent;
      border-radius: 10px;
      background: #334155;
      color: var(--text);
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice-btn.selected-green {
      border-color: var(--accent);
      background: #14532d;
    }

    .choice-btn.selected-pink {
      border-color: var(--accent-pink);
      background: #831843;
    }

    /* Zakład */
    .bet-input-group {
      margin-bottom: 25px;
    }

    .bet-input-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--subtext);
      font-size: 0.9rem;
    }

    .bet-input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text);
      font-size: 1.1rem;
      text-align: center;
    }

    .flip-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #022c22;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .flip-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .history {
      margin-top: 30px;
      text-align: left;
    }

    .history h3 {
      font-size: 1rem;
      color: var(--subtext);
      margin-bottom: 10px;
    }

    .history-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .history-item {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: bold;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🌱 GardenFlip</div>
    <div class="balance-box">Konieczyny: <span id="balance">1000</span> ☘️</div>
  </header>

  <div class="container">
    <h2>Rzut Roślinną Monetą</h2>
    <p style="color: var(--subtext); font-size: 0.9rem; margin-top: 5px;">Wybierz stronę i obstaw wirtualne koniczyny</p>

    <div class="coin-wrapper">
      <div class="coin" id="coin">
        <div class="coin-face side-green">🌿</div>
        <div class="coin-face side-pink">🌸</div>
      </div>
    </div>

    <div class="choices">
      <button class="choice-btn selected-green" id="btn-green" onclick="selectSide('green')">🌿 Zielony Liść</button>
      <button class="choice-btn" id="btn-pink" onclick="selectSide('pink')">🌸 Różowy Kwiat</button>
    </div>

    <div class="bet-input-group">
      <label for="bet-amount">Stawka:</label>
      <input type="number" id="bet-amount" value="100" min="10" step="10" />
    </div>

    <button class="flip-btn" id="flip-btn" onclick="playGame()">Graj (2x)</button>

    <div class="history">
      <h3>Ostatnie wyniki:</h3>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script>
    let balance = parseInt(localStorage.getItem('gf_balance')) || 1000;
    let selectedSide = 'green';
    let isFlipping = false;
    let currentRotation = 0;

    const balanceEl = document.getElementById('balance');
    const coinEl = document.getElementById('coin');
    const betInput = document.getElementById('bet-amount');
    const flipBtn = document.getElementById('flip-btn');
    const historyList = document.getElementById('history-list');

    function updateBalanceDisplay() {
      balanceEl.textContent = balance;
      localStorage.setItem('gf_balance', balance);
    }

    function selectSide(side) {
      if (isFlipping) return;
      selectedSide = side;
      document.getElementById('btn-green').className = `choice-btn ${side === 'green' ? 'selected-green' : ''}`;
      document.getElementById('btn-pink').className = `choice-btn ${side === 'pink' ? 'selected-pink' : ''}`;
    }

    function playGame() {
      const bet = parseInt(betInput.value);

      if (isNaN(bet) || bet <= 0) {
        alert('Wpisz poprawną stawkę!');
        return;
      }

      if (bet > balance) {
        alert('Nie masz wystarczająco koniczyn! Jeśli zbrakło Ci waluty, zresetuj ją poniżej.');
        return;
      }

      isFlipping = true;
      flipBtn.disabled = true;
      balance -= bet;
      updateBalanceDisplay();

      // Wynik gry (50% szans)
      const isGreen = Math.random() < 0.5;
      const resultSide = isGreen ? 'green' : 'pink';

      // Obliczenie rotacji (minimum 5 pełnych obrotów + korygowanie do wybranego wyniku)
      const extraSpins = 5 * 360;
      const targetDeg = isGreen ? 0 : 180;
      
      // Zapewniamy, że moneta kręci się zawsze w jedną stronę
      currentRotation += extraSpins + (targetDeg - (currentRotation % 360));
      if ((currentRotation / 180) % 2 !== (isGreen ? 0 : 1)) {
        currentRotation += 180;
      }

      coinEl.style.transform = `rotateY(${currentRotation}deg)`;

      setTimeout(() => {
        isFlipping = false;
        flipBtn.disabled = false;

        const won = selectedSide === resultSide;
        if (won) {
          const winAmount = bet * 2;
          balance += winAmount;
          updateBalanceDisplay();
        }

        // Dodaj do historii
        addHistory(resultSide);

      }, 3000);
    }

    function addHistory(side) {
      const badge = document.createElement('div');
      badge.className = `history-item ${side === 'green' ? 'side-green' : 'side-pink'}`;
      badge.textContent = side === 'green' ? '🌿' : '🌸';
      historyList.prepend(badge);

      if (historyList.children.length > 10) {
        historyList.removeChild(historyList.lastChild);
      }
    }

    // Inicjalizacja
    updateBalanceDisplay();
  </script>
</body>
</html>
