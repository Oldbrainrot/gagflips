<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Garden RPS - Inventory & Admin</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --accent-pink: #ec4899;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --admin-color: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
    }

    .admin-toggle-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .admin-toggle-btn:hover {
      opacity: 1;
    }

    .btn-faucet {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-faucet:hover {
      background: #2563eb;
    }

    .main-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Panel Admina */
    .admin-panel {
      display: none;
      width: 100%;
      max-width: 900px;
      background: #281e11;
      border: 2px dashed var(--admin-color);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .admin-panel.active {
      display: block;
    }

    .admin-title {
      color: var(--admin-color);
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .admin-btn {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      background: var(--admin-color);
      color: #1a1a1a;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      transition: filter 0.2s;
    }

    .admin-btn:hover {
      filter: brightness(1.2);
    }

    .admin-btn.danger {
      background: #ef4444;
      color: white;
    }

    /* System Ekwipunku */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 10px;
      min-height: 160px;
      max-height: 260px;
      overflow-y: auto;
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .inventory-item {
      aspect-ratio: 1;
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1.5rem;
      position: relative;
    }

    .inventory-item:hover {
      border-color: var(--accent);
    }

    .inventory-item.selected {
      border-color: var(--accent);
      background: #14532d;
    }

    .item-name {
      font-size: 0.65rem;
      color: var(--subtext);
      margin-top: 4px;
    }

    /* Wybór RPS */
    .rps-choices {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .rps-btn {
      flex: 1;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: #0f172a;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .rps-btn span {
      font-size: 0.75rem;
      color: var(--subtext);
    }

    .rps-btn.selected {
      border-color: var(--accent);
      background: #14532d;
    }

    .btn-play {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #022c22;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-play:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Modal / Arena Walki */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .arena-card {
      background: var(--card-bg);
      width: 90%;
      max-width: 450px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .battle-display {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin: 30px 0;
    }

    .battle-hand {
      font-size: 3.5rem;
      transition: transform 0.2s;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--subtext);
      font-size: 0.85rem;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <div class="logo">🌱 Garden RPS</div>
      <button class="admin-toggle-btn" onclick="toggleAdminPrompt()" title="Panel Administratora">🔒</button>
    </div>
    <button class="btn-faucet" onclick="claimStarterItem()">+ DARMOWE NASIONO</button>
  </header>

  <!-- Panel Admina -->
  <div class="admin-panel" id="admin-panel">
    <div class="admin-title">⚡ PANEL ADMINISTRATORA</div>
    <p style="font-size: 0.8rem; color: var(--subtext); margin-bottom: 12px;">Dodawaj lub usuwaj przedmioty w ekwipunku:</p>
    <div class="admin-controls">
      <button class="admin-btn" onclick="adminGiveItem('Nasiono', '🌱')">+ 🌱 Nasiono</button>
      <button class="admin-btn" onclick="adminGiveItem('Róża', '🌹')">+ 🌹 Róża</button>
      <button class="admin-btn" onclick="adminGiveItem('Kaktus', '🌵')">+ 🌵 Kaktus</button>
      <button class="admin-btn" onclick="adminGiveItem('Słonecznik', '🌻')">+ 🌻 Słonecznik</button>
      <button class="admin-btn" onclick="adminGiveItem('Złota Jabłoń', '🍎')">+ 🍎 Złota Jabłoń</button>
      <button class="admin-btn" onclick="adminGiveRandom(5)">+5 Random Items</button>
      <button class="admin-btn danger" onclick="adminClearInventory()">🗑️ Wyczyść Ekwipunek</button>
    </div>
  </div>

  <div class="main-grid">
    <!-- Panel Ekwipunku -->
    <div class="card">
      <h2>Ekwipunek (<span id="inv-count">0</span>)</h2>
      <div class="inventory-grid" id="inventory-grid">
        <!-- Przedmioty będą renderowane dynamicznie -->
      </div>
    </div>

    <!-- Panel Areny Rock Paper Scissors -->
    <div class="card">
      <h2>Kamień, Papier, Nożyce</h2>
      
      <p style="font-size: 0.85rem; color: var(--subtext); margin-bottom: 15px;">
        Zaznacz przedmiot z ekwipunku i wybierz swój ruch. W przypadku wygranej otrzymujesz <strong>2x swój przedmiot</strong>!
      </p>

      <div class="rps-choices">
        <button class="rps-btn" id="rps-rock" onclick="selectRPS('rock')">
          🪨 <span>Kamień</span>
        </button>
        <button class="rps-btn" id="rps-paper" onclick="selectRPS('paper')">
          📄 <span>Papier</span>
        </button>
        <button class="rps-btn" id="rps-scissors" onclick="selectRPS('scissors')">
          ✂️ <span>Nożyce</span>
        </button>
      </div>

      <button class="btn-play" id="btn-play" onclick="playRPS()" disabled>Zagraj o przedmiot</button>
    </div>
  </div>

  <!-- Modal Wyniku Gra -->
  <div class="modal-overlay" id="arena-modal">
    <div class="arena-card">
      <h2 id="arena-status">Pojedynek...</h2>

      <div class="battle-display">
        <div>
          <div class="battle-hand" id="p1-hand">✊</div>
          <span style="font-size: 0.8rem; color: var(--subtext);">Ty</span>
        </div>
        <div style="font-size: 1.5rem; font-weight: bold; color: var(--subtext);">VS</div>
        <div>
          <div class="battle-hand" id="p2-hand">✊</div>
          <span style="font-size: 0.8rem; color: var(--subtext);">Przeciwnik</span>
        </div>
      </div>

      <p id="arena-result" style="font-weight: bold; font-size: 1.1rem; min-height: 24px;"></p>
    </div>
  </div>

  <script>
    let inventory = JSON.parse(localStorage.getItem('grps_inventory')) || [];
    let selectedItemIndex = null;
    let selectedRPS = null;
    let isAdminUnlocked = false;

    const inventoryGrid = document.getElementById('inventory-grid');
    const invCount = document.getElementById('inv-count');
    const btnPlay = document.getElementById('btn-play');
    const adminPanel = document.getElementById('admin-panel');

    const availableItems = [
      { name: 'Nasiono', icon: '🌱' },
      { name: 'Róża', icon: '🌹' },
      { name: 'Kaktus', icon: '🌵' },
      { name: 'Słonecznik', icon: '🌻' },
      { name: 'Złota Jabłoń', icon: '🍎' }
    ];

    function saveInventory() {
      localStorage.setItem('grps_inventory', JSON.stringify(inventory));
      renderInventory();
    }

    function renderInventory() {
      inventoryGrid.innerHTML = '';
      invCount.textContent = inventory.length;

      if (inventory.length === 0) {
        inventoryGrid.innerHTML = '<div class="empty-msg">Ekwipunek jest pusty.<br>Odbierz darmowe nasiono u góry!</div>';
        selectedItemIndex = null;
        updatePlayButton();
        return;
      }

      inventory.forEach((item, index) => {
        const itemEl = document.createElement('div');
        itemEl.className = `inventory-item ${selectedItemIndex === index ? 'selected' : ''}`;
        itemEl.onclick = () => selectItem(index);
        
        itemEl.innerHTML = `
          ${item.icon}
          <div class="item-name">${item.name}</div>
        `;
        inventoryGrid.appendChild(itemEl);
      });

      updatePlayButton();
    }

    function claimStarterItem() {
      inventory.push({ name: 'Nasiono', icon: '🌱' });
      saveInventory();
    }

    function selectItem(index) {
      selectedItemIndex = index;
      renderInventory();
    }

    function selectRPS(choice) {
      selectedRPS = choice;
      document.getElementById('rps-rock').className = `rps-btn ${choice === 'rock' ? 'selected' : ''}`;
      document.getElementById('rps-paper').className = `rps-btn ${choice === 'paper' ? 'selected' : ''}`;
      document.getElementById('rps-scissors').className = `rps-btn ${choice === 'scissors' ? 'selected' : ''}`;
      updatePlayButton();
    }

    function updatePlayButton() {
      btnPlay.disabled = selectedItemIndex === null || selectedRPS === null || inventory.length === 0;
    }

    /* FUNKCJE PANELU ADMINISTRATORA */
    function toggleAdminPrompt() {
      if (isAdminUnlocked) {
        adminPanel.classList.toggle('active');
        return;
      }

      const password = prompt('Podaj kod administratora:');
      if (password === 'admin123') {
        isAdminUnlocked = true;
        adminPanel.classList.add('active');
        alert('Panel administratora odblokowany!');
      } else if (password !== null) {
        alert('Nieprawidłowe hasło!');
      }
    }

    function adminGiveItem(name, icon) {
      inventory.push({ name, icon });
      saveInventory();
    }

    function adminGiveRandom(count) {
      for (let i = 0; i < count; i++) {
        const randomItem = availableItems[Math.floor(Math.random() * availableItems.length)];
        inventory.push({ ...randomItem });
      }
      saveInventory();
    }

    function adminClearInventory() {
      if (confirm('Czy na pewno chcesz usunąć WSZYSTKIE przedmioty?')) {
        inventory = [];
        selectedItemIndex = null;
        saveInventory();
      }
    }

    // Skrót klawiszowy: F12 aktywuje Panel Admina
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12') {
        e.preventDefault(); // Próbuje zablokować domyślne zachowanie (np. konsolę)
        toggleAdminPrompt();
      }
    });

    /* SILNIK GRY (30% SZANS) */
    function playRPS() {
      if (selectedItemIndex === null || !selectedRPS) return;

      const modal = document.getElementById('arena-modal');
      const p1Hand = document.getElementById('p1-hand');
      const p2Hand = document.getElementById('p2-hand');
      const statusEl = document.getElementById('arena-status');
      const resultEl = document.getElementById('arena-result');

      modal.style.display = 'flex';
      statusEl.textContent = "Pojedynek...";
      resultEl.textContent = "";

      const icons = { rock: '🪨', paper: '📄', scissors: '✂️' };
      const winningMove = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
      const losingMove = { rock: 'paper', paper: 'scissors', scissors: 'rock' };

      // Algorytm: Dokładnie 30% szans na wygraną gracza
      const isPlayerWinner = Math.random() < 0.3;
      let botMove;

      if (isPlayerWinner) {
        botMove = winningMove[selectedRPS];
      } else {
        botMove = losingMove[selectedRPS];
      }

      p1Hand.textContent = '✊';
      p2Hand.textContent = '✊';

      setTimeout(() => {
        p1Hand.textContent = icons[selectedRPS];
        p2Hand.textContent = icons[botMove];

        const playedItem = inventory[selectedItemIndex];

        if (isPlayerWinner) {
          statusEl.textContent = "Wygrana!";
          resultEl.textContent = `Podwojono ${playedItem.name}! (+2x)`;
          resultEl.style.color = "var(--accent)";
          
          inventory.push({ ...playedItem });
        } else {
          statusEl.textContent = "Przegrana!";
          resultEl.textContent = `Straciłeś ${playedItem.name}.`;
          resultEl.style.color = "var(--accent-pink)";
          
          inventory.splice(selectedItemIndex, 1);
        }

        selectedItemIndex = null;
        saveInventory();

        setTimeout(() => {
          modal.style.display = 'none';
        }, 2000);

      }, 1200);
    }

    // Inicjalizacja
    renderInventory();
  </script>
</body>
</html>
