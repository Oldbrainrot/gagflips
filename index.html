<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Garden Flip - Lobby & Mecze</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --accent-pink: #ec4899;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: var(--card-bg);
      padding: 15px 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--accent);
    }

    .balance-box {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .main-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .card h2 {
      font-size: 1.2rem;
      margin-bottom: 15px;
      color: var(--text);
    }

    /* Formularz Tworzenia Gry */
    .create-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    .form-group input {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
    }

    .choices {
      display: flex;
      gap: 10px;
    }

    .choice-btn {
      flex: 1;
      padding: 10px;
      border: 2px solid transparent;
      border-radius: 8px;
      background: #334155;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .choice-btn.selected-green {
      border-color: var(--accent);
      background: #14532d;
    }

    .choice-btn.selected-pink {
      border-color: var(--accent-pink);
      background: #831843;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #022c22;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-submit:hover {
      filter: brightness(1.1);
    }

    /* Lista Meczy */
    .matches-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 450px;
      overflow-y: auto;
    }

    .match-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .player-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .player-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .match-details {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .bet-tag {
      font-weight: bold;
      color: var(--accent);
    }

    .btn-join {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-join:hover {
      background: #2563eb;
    }

    /* Modal Areny Gry */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .arena-card {
      background: var(--card-bg);
      width: 90%;
      max-width: 500px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .versus-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .versus-player {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    /* Moneta Animacja */
    .coin-wrapper {
      perspective: 1000px;
      margin: 25px auto;
      width: 100px;
      height: 100px;
    }

    .coin {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      border: 3px solid rgba(255,255,255,0.2);
    }

    .side-green {
      background: radial-gradient(circle, #22c55e, #15803d);
    }

    .side-pink {
      background: radial-gradient(circle, #ec4899, #be185d);
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🌱 GardenFlip</div>
    <div class="balance-box">Konieczyny: <span id="balance">1000</span> ☘️</div>
  </header>

  <div class="main-grid">
    <!-- Panel Tworzenia Gry -->
    <div class="card">
      <h2>Stwórz Pokój</h2>
      <div class="create-form">
        <div class="form-group">
          <label>Twoja Strona:</label>
          <div class="choices">
            <button class="choice-btn selected-green" id="btn-green" onclick="selectSide('green')">🌿 Liść</button>
            <button class="choice-btn" id="btn-pink" onclick="selectSide('pink')">🌸 Kwiat</button>
          </div>
        </div>

        <div class="form-group">
          <label for="bet-amount">Stawka (Koniczyny):</label>
          <input type="number" id="bet-amount" value="50" min="10" step="10" />
        </div>

        <button class="btn-submit" onclick="createMatch()">+ Stwórz Mecz</button>
      </div>
    </div>

    <!-- Lista Pokoi / Meczy -->
    <div class="card">
      <h2>Lobby Meczy (<span id="matches-count">0</span>)</h2>
      <div class="matches-list" id="matches-list">
        <!-- Pokoje generowane dynamicznie -->
      </div>
    </div>
  </div>

  <!-- Modal Gra / Rzut Monetą -->
  <div class="modal-overlay" id="arena-modal">
    <div class="arena-card">
      <h2 id="arena-status">Przygotowanie do rzutu...</h2>
      
      <div class="versus-container">
        <div class="versus-player">
          <div class="player-avatar">🧑</div>
          <strong id="p1-name">Gracz 1</strong>
          <span id="p1-choice" style="font-size: 1.2rem;">🌿</span>
        </div>
        <div style="font-size: 1.5rem; font-weight: bold; color: var(--subtext);">VS</div>
        <div class="versus-player">
          <div class="player-avatar">👤</div>
          <strong id="p2-name">Gracz 2</strong>
          <span id="p2-choice" style="font-size: 1.2rem;">🌸</span>
        </div>
      </div>

      <div class="coin-wrapper">
        <div class="coin" id="coin">
          <div class="coin-face side-green">🌿</div>
          <div class="coin-face side-pink">🌸</div>
        </div>
      </div>

      <p id="arena-result" style="font-weight: bold; font-size: 1.1rem; min-height: 24px;"></p>
    </div>
  </div>

  <script>
    let balance = parseInt(localStorage.getItem('gf_balance')) || 1000;
    let selectedSide = 'green';
    let currentRotation = 0;

    const balanceEl = document.getElementById('balance');
    const betInput = document.getElementById('bet-amount');
    const matchesList = document.getElementById('matches-list');
    const matchesCount = document.getElementById('matches-count');
    
    // Przykładowe imiona graczy symulujących lobby
    const botNames = ["GamerPro99", "PlantMaster", "Robloxian_21", "LeafLover", "LuckyClover"];

    // Lista aktywnych meczy w pamięci
    let matches = [
      { id: 1, host: "PlantMaster", side: "green", bet: 100 },
      { id: 2, host: "Robloxian_21", side: "pink", bet: 250 }
    ];

    function updateBalanceDisplay() {
      balanceEl.textContent = balance;
      localStorage.setItem('gf_balance', balance);
    }

    function selectSide(side) {
      selectedSide = side;
      document.getElementById('btn-green').className = `choice-btn ${side === 'green' ? 'selected-green' : ''}`;
      document.getElementById('btn-pink').className = `choice-btn ${side === 'pink' ? 'selected-pink' : ''}`;
    }

    function renderMatches() {
      matchesList.innerHTML = '';
      matchesCount.textContent = matches.length;

      if (matches.length === 0) {
        matchesList.innerHTML = '<p style="color: var(--subtext); text-align: center; margin-top: 20px;">Brak aktywnych gier. Stwórz pierwszą!</p>';
        return;
      }

      matches.forEach(match => {
        const item = document.createElement('div');
        item.className = 'match-item';
        
        const hostSideIcon = match.side === 'green' ? '🌿' : '🌸';
        const opponentSideIcon = match.side === 'green' ? '🌸' : '🌿';

        item.innerHTML = `
          <div class="player-info">
            <div class="player-avatar">👤</div>
            <div>
              <strong>${match.host}</strong>
              <div style="font-size: 0.8rem; color: var(--subtext);">Wybiera: ${hostSideIcon}</div>
            </div>
          </div>
          <div class="match-details">
            <span class="bet-tag">${match.bet} ☘️</span>
            <button class="btn-join" onclick="joinMatch(${match.id})">Dołącz (${opponentSideIcon})</button>
          </div>
        `;
        matchesList.appendChild(item);
      });
    }

    function createMatch() {
      const bet = parseInt(betInput.value);

      if (isNaN(bet) || bet <= 0) {
        alert('Podaj poprawną stawkę!');
        return;
      }

      if (bet > balance) {
        alert('Nie masz wystarczająco koniczyn!');
        return;
      }

      // Odebranie stawki na czas trwania pokoju
      balance -= bet;
      updateBalanceDisplay();

      const newMatch = {
        id: Date.now(),
        host: "Ty",
        side: selectedSide,
        bet: bet
      };

      // Symulacja: Po utworzeniu pokoju po 3-6 sekundach inny gracz dołącza automatycznie
      matches.unshift(newMatch);
      renderMatches();

      setTimeout(() => {
        // Jeśli mecz nadal istnieje na liście, inny gracz do niego dołącza
        const matchIndex = matches.findIndex(m => m.id === newMatch.id);
        if (matchIndex !== -1) {
          const randomBot = botNames[Math.floor(Math.random() * botNames.length)];
          startGame(newMatch.host, randomBot, newMatch.side, newMatch.bet, true);
          matches.splice(matchIndex, 1);
          renderMatches();
        }
      }, Math.floor(Math.random() * 3000) + 3000);
    }

    function joinMatch(matchId) {
      const match = matches.find(m => m.id === matchId);
      if (!match) return;

      if (match.bet > balance) {
        alert('Nie masz wystarczająco koniczyn, aby dołączyć do tego meczu!');
        return;
      }

      // Pobranie wpisowego
      balance -= match.bet;
      updateBalanceDisplay();

      // Usunięcie meczu z listy
      matches = matches.filter(m => m.id !== matchId);
      renderMatches();

      // Przeciwnik przyjmuje drugą stronę
      const playerSide = match.side === 'green' ? 'pink' : 'green';
      startGame(match.host, "Ty", match.side, match.bet, false);
    }

    function startGame(p1Name, p2Name, p1Side, bet, isHost) {
      const modal = document.getElementById('arena-modal');
      const coinEl = document.getElementById('coin');
      const statusEl = document.getElementById('arena-status');
      const resultEl = document.getElementById('arena-result');

      // Ustawienia widoku
      document.getElementById('p1-name').textContent = p1Name;
      document.getElementById('p1-choice').textContent = p1Side === 'green' ? '🌿' : '🌸';
      
      document.getElementById('p2-name').textContent = p2Name;
      document.getElementById('p2-choice').textContent = p1Side === 'green' ? '🌸' : '🌿';

      statusEl.textContent = "Losowanie...";
      resultEl.textContent = "";
      modal.style.display = 'flex';

      // Wynik (50/50)
      const isGreen = Math.random() < 0.5;
      const resultSide = isGreen ? 'green' : 'pink';

      // Animacja obrotu monety
      const extraSpins = 5 * 360;
      const targetDeg = isGreen ? 0 : 180;
      currentRotation += extraSpins + (targetDeg - (currentRotation % 360));
      
      if ((currentRotation / 180) % 2 !== (isGreen ? 0 : 1)) {
        currentRotation += 180;
      }

      coinEl.style.transform = `rotateY(${currentRotation}deg)`;

      // Rozstrzygnięcie po 3 sekundach
      setTimeout(() => {
        const p1Won = p1Side === resultSide;
        const winnerName = p1Won ? p1Name : p2Name;
        
        statusEl.textContent = `Wypadło: ${isGreen ? '🌿 Zielony Liść' : '🌸 Różowy Kwiat'}`;
        resultEl.textContent = `Wygrywa ${winnerName}! (+${bet * 2} ☘️)`;
        resultEl.style.color = "var(--accent)";

        // Przyznanie wygranej
        const playerWon = (isHost && p1Won) || (!isHost && !p1Won);
        if (playerWon) {
          balance += bet * 2;
          updateBalanceDisplay();
        }

        // Zamknięcie okna po 2.5s
        setTimeout(() => {
          modal.style.display = 'none';
        }, 2500);

      }, 3000);
    }

    // Inicjalizacja
    updateBalanceDisplay();
    renderMatches();
  </script>
</body>
</html>
    updateBalanceDisplay();
  </script>
</body>
</html>
